name: Pages

# Deploys site/ to GitHub Pages. Enable it once: repo Settings -> Pages ->
# Source: GitHub Actions. The site is static — no analytics, no cookies.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage the static site
        run: |
          mkdir -p _site/assets
          cp site/index.html site/styles.css _site/
          cp assets/plumb-logo.svg assets/plumb-demo.gif \
             assets/plumb-corpus.png assets/plumb-social.png _site/assets/
      - uses: actions/configure-pages@v6
        with:
          # First run enables Pages itself (Source: GitHub Actions); no manual toggle.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
