name: Release

# Publish to PyPI when a version tag is pushed:  git tag v0.1.0 && git push origin v0.1.0
# Uses PyPI Trusted Publishing (OIDC) — no long-lived API token is stored. The pending
# publisher on PyPI must match: project `plumb-verify`, owner `haqaliz`, repo `plumb`,
# workflow `release.yml`, environment `pypi` (see docs/LAUNCH.md, "Publishing").
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: build, smoke-test, publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/plumb-verify
    permissions:
      contents: write # gh release create
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv build
      # A wheel that does not install standalone must never reach PyPI.
      - name: smoke-test the wheel
        run: |
          uv venv --python 3.11 /tmp/plumb-smoke
          uv pip install --python /tmp/plumb-smoke/bin/python dist/*.whl
          /tmp/plumb-smoke/bin/plumb --help
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: attach artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
