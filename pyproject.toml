[project]
name = "plumb"
version = "0.0.0"
description = "Execution-grounded research-integrity verifier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
