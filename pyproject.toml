[project]
name = "plumb-verify"
version = "0.2.0"
description = "Execution-grounded research-integrity verifier: re-run a paper's own artifacts and return a per-claim, reproducible verdict"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "aliz" }]
keywords = [
    "research-integrity",
    "reproducibility",
    "verification",
    "science",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pypdf==6.19.0",
]

[project.urls]
Homepage = "https://github.com/haqaliz/plumb"
Repository = "https://github.com/haqaliz/plumb"
Issues = "https://github.com/haqaliz/plumb/issues"
Roadmap = "https://github.com/haqaliz/plumb/blob/master/docs/ROADMAP.md"
Changelog = "https://github.com/haqaliz/plumb/blob/master/CHANGELOG.md"

[project.scripts]
plumb = "plumb.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumb"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/plumb",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
